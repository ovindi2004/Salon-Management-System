<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animated Dots Background</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-20px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.5; }
        }
    </style>
</head>
<body>
<!-- Multiple dots -->
<div class="dot" style="top:10%; left:20%; animation-delay:0s;"></div>
<div class="dot" style="top:30%; left:40%; animation-delay:1s;"></div>
<div class="dot" style="top:50%; left:60%; animation-delay:2s;"></div>
<div class="dot" style="top:70%; left:80%; animation-delay:3s;"></div>
<div class="dot" style="top:20%; left:70%; animation-delay:4s;"></div>
<div class="dot" style="top:80%; left:30%; animation-delay:5s;"></div>
</body>
</html>
