<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pink Beauty Salon - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                    radial-gradient(
                            circle at 10% 20%,
                            rgba(255, 105, 180, 0.18),
                            transparent 30%
                    ),
                    radial-gradient(
                            circle at 90% 80%,
                            rgba(212, 175, 55, 0.16),
                            transparent 30%
                    ),
                    linear-gradient(
                            135deg,
                            #0b0b0f,
                            #151218,
                            #0e0e12
                    );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            overflow-x: hidden;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .auth-container {
            width: 100%;
            max-width: 450px;
        }


        /* =========================
           REGISTER CARD
        ========================= */

        .auth-card {
            position: relative;

            width: 100%;

            padding: 40px 38px;

            background:
                    linear-gradient(
                            145deg,
                            rgba(31, 24, 32, 0.98),
                            rgba(14, 14, 18, 0.98)
                    );

            border: 1px solid rgba(255, 182, 193, 0.18);

            border-radius: 28px;

            box-shadow:
                    0 30px 80px rgba(0, 0, 0, 0.65),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);

            overflow: hidden;
        }


        /* =========================
           CARD GLOW
        ========================= */

        .auth-card::before {
            content: "";

            position: absolute;

            top: -100px;
            left: 50%;

            transform: translateX(-50%);

            width: 260px;
            height: 180px;

            background:
                    rgba(255, 105, 180, 0.12);

            filter: blur(65px);

            pointer-events: none;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            position: relative;

            text-align: center;

            margin-bottom: 22px;
        }

        .logo h1 {
            font-family: Georgia, serif;

            font-size: 25px;

            letter-spacing: 5px;

            background:
                    linear-gradient(
                            135deg,
                            #d4af37,
                            #f5d6e6,
                            #ff9fc8
                    );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .logo span {
            display: block;

            margin-top: 7px;

            font-size: 10px;

            letter-spacing: 7px;

            color: #d9a7b8;
        }


        /* =========================
           TITLE
        ========================= */

        .auth-card h2 {
            text-align: center;

            font-family: Georgia, serif;

            font-size: 29px;

            margin-bottom: 8px;

            color: #ffffff;
        }

        .sub-text {
            text-align: center;

            color: #96939b;

            font-size: 14px;

            margin-bottom: 23px;
        }


        /* =========================
           ROLE NOTE
        ========================= */

        .role-note {
            display: flex;

            align-items: flex-start;

            gap: 10px;

            padding: 13px 14px;

            margin-bottom: 22px;

            border-radius: 12px;

            background:
                    linear-gradient(
                            135deg,
                            rgba(212, 175, 55, 0.08),
                            rgba(255, 105, 180, 0.04)
                    );

            border: 1px solid
            rgba(212, 175, 55, 0.20);

            color: #e6c8a3;

            font-size: 12px;

            line-height: 1.5;
        }

        .role-icon {
            display: flex;

            justify-content: center;
            align-items: center;

            min-width: 20px;
            height: 20px;

            border-radius: 50%;

            background: rgba(212, 175, 55, 0.15);

            color: #d4af37;

            font-size: 12px;
        }


        /* =========================
           INPUT
        ========================= */

        .input-group {
            position: relative;

            margin-bottom: 19px;
        }

        .input-group input {
            width: 100%;

            height: 53px;

            padding: 15px 16px;

            background:
                    rgba(255, 255, 255, 0.035);

            border: 1px solid
            rgba(255, 255, 255, 0.10);

            border-radius: 12px;

            color: white;

            outline: none;

            font-size: 14px;

            transition: 0.3s ease;
        }

        .input-group input:hover {
            border-color:
                    rgba(255, 182, 193, 0.30);
        }

        .input-group input:focus {
            border-color: #d4af37;

            background:
                    rgba(212, 175, 55, 0.035);

            box-shadow:
                    0 0 0 3px
                    rgba(212, 175, 55, 0.07);
        }


        /* Floating Label */

        .input-group label {
            position: absolute;

            left: 16px;
            top: 17px;

            color: #89858e;

            font-size: 14px;

            pointer-events: none;

            transition: 0.25s ease;

            background: transparent;
        }

        .input-group input:focus + label,
        .input-group input:valid + label {
            top: -8px;

            left: 12px;

            padding: 0 6px;

            background: #1b171d;

            color: #e6c8a3;

            font-size: 11px;

            border-radius: 5px;
        }


        /* =========================
           PASSWORD HINT
        ========================= */

        .password-hint {
            margin-top: -10px;

            margin-bottom: 18px;

            color: #706d75;

            font-size: 11px;

            line-height: 1.4;
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        .auth-btn {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 30px;

            background:
                    linear-gradient(
                            135deg,
                            #d4af37,
                            #e6c8a3,
                            #f5d6e6,
                            #ff9fc8
                    );

            background-size: 200% 200%;

            color: #191216;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.4s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);

            background-position: 100% 50%;

            box-shadow:
                    0 12px 30px
                    rgba(212, 175, 55, 0.25),

                    0 5px 20px
                    rgba(255, 105, 180, 0.12);
        }

        .auth-btn:active {
            transform: translateY(0);
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            text-align: center;

            font-size: 13px;

            min-height: 20px;

            margin-top: 11px;
        }

        .success {
            color: #7fd1a3;
        }

        .error {
            color: #e88b9a;
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;

            color: #77747c;

            font-size: 10px;

            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                    linear-gradient(
                            to right,
                            transparent,
                            rgba(255,255,255,0.12)
                    );
        }

        .divider::after {
            background:
                    linear-gradient(
                            to left,
                            transparent,
                            rgba(255,255,255,0.12)
                    );
        }


        /* =========================
           SOCIAL BUTTONS
        ========================= */

        .social-buttons {
            display: flex;

            gap: 12px;
        }

        .social-buttons button {
            flex: 1;

            height: 45px;

            background:
                    rgba(255,255,255,0.035);

            border: 1px solid
            rgba(255,255,255,0.10);

            border-radius: 11px;

            color: #ddd;

            font-size: 13px;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .social-buttons button:hover {
            border-color:
                    rgba(212,175,55,0.6);

            background:
                    rgba(212,175,55,0.06);

            transform: translateY(-2px);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .switch-text {
            text-align: center;

            color: #85818a;

            font-size: 14px;

            margin-top: 24px;
        }

        .switch-text a {
            color: #d4af37;

            font-weight: bold;

            text-decoration: none;

            margin-left: 4px;

            transition: 0.3s;
        }

        .switch-text a:hover {
            color: #f5d6e6;

            text-decoration: underline;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .auth-card {
                padding: 32px 22px;

                border-radius: 22px;
            }

            .logo h1 {
                font-size: 21px;
            }

            .auth-card h2 {
                font-size: 26px;
            }

            .social-buttons {
                flex-direction: column;
            }
        }

    </style>
</head>


<body>

<div class="auth-container">

    <div class="auth-card">

        <!-- Logo -->

        <div class="logo">

            <h1>PINK BEAUTY</h1>

            <span>SALON</span>

        </div>


        <!-- Heading -->

        <h2>Create Account</h2>

        <p class="sub-text">
            Begin your beauty journey with us
        </p>


        <!-- Role Information -->

        <div class="role-note">

            <div class="role-icon">
                ⓘ
            </div>

            <span>
                New accounts are automatically
                registered as Customer accounts.
            </span>

        </div>


        <!-- Register Form -->

        <form id="registerForm">


            <!-- Full Name -->

            <div class="input-group">

                <input
                        type="text"
                        id="name"
                        required
                        autocomplete="name"
                >

                <label>Full Name</label>

            </div>


            <!-- Email -->

            <div class="input-group">

                <input
                        type="email"
                        id="email"
                        required
                        autocomplete="email"
                >

                <label>Email Address</label>

            </div>


            <!-- Phone -->

            <div class="input-group">

                <input
                        type="tel"
                        id="phone"
                        required
                        autocomplete="tel"
                >

                <label>Phone Number</label>

            </div>


            <!-- Password -->

            <div class="input-group">

                <input
                        type="password"
                        id="password"
                        required
                        autocomplete="new-password"
                >

                <label>Password</label>

            </div>


            <!-- Password Hint -->

            <p class="password-hint">
                Use at least 8 characters with a combination
                of letters and numbers.
            </p>


            <!-- Confirm Password -->

            <div class="input-group">

                <input
                        type="password"
                        id="confirmPassword"
                        required
                        autocomplete="new-password"
                >

                <label>Confirm Password</label>

            </div>


            <!-- Register Button -->

            <button type="button" onclick="register()" class="auth-btn">
                CREATE ACCOUNT
            </button>


            <!-- Message -->

            <p id="registerMessage" class="message"></p>

        </form>




        <!-- Login -->

        <p class="switch-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


</body>
<script>
    function register() {

        const user = {
            userName: document.getElementById("name").value,
            userEmail: document.getElementById("email").value,
            userPassword: document.getElementById("password").value,
            userPhone: Number(document.getElementById("phone").value),
            role: "CUSTOMER"
        };

        console.log(user);

        fetch("http://localhost:8080/api/v1/user/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(user)
        })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                window.location.href = "login.html";
            })
            .catch(error => {
                console.error(error);
                alert("Registration Failed!");
            });
    }
</script>



</html>
